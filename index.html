<!DOCTYPE html>
<html lang="EN">
<head>
    <meta charset="UTF-8" />
    <title>Lab 5 - HTML Forms</title>
</head>
<body>
    <h1>Volunteer Form</h1>
    <form action="http://bloomingdale.sat.iit.edu/kriedan/lab3formscript.php" method="POST">

        <div>
            <label for="fname">First name:</label>
            <input type="text" id="fname" name="first_name_field" required>
        </div>      
        <div>
            <label for="lname">Last name:</label>
            <input type="text" id="lname" name="last_name_field" required>
        </div>
        <div>
            <label for="phone">Phone:</label>
            <input type="tel" id="phone" name="phone_field">
        </div>
        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email_field" placeholder="hello@world">
        </div>
        <div>
            <label>Gender:</label> <br>
            <input type="radio" id="gender_male" name="gender_field" value="Male">
            <label for="gender_male">Male</label>
            <input type="radio" id="gender_female" name="gender_field" value="Female">
            <label for="gender_female">Female</label>   
            <input type="radio" id="gender_other" name="gender_field" value="Other">
            <label for="gender_other">Other</label>                     
        </div>      

        <div>
            <label for="age_selection">Age:</label>
            <select name="age_field" id="age_selection">
                <option value="Under 18">Under 18</option>
                <option value="Over 18">Over 18</option>
            </select>
        </div>

        <div>

            <input type="checkbox" id="sunday" name="available_field[]" value="Sunday">
            <label for="sunday">Sunday</label> <br>
            <input type="checkbox" id="monday" name="available_field[]" value="Monday">
            <label for="monday">Monday</label> <br>
            <input type="checkbox" id="tuesday" name="available_field[]" value="Tuesday">
            <label for="tuesday">Tuesday</label> <br>
            <input type="checkbox" id="wednesday" name="available_field[]" value="Wednesday">
            <label for="wednesday">Wednesday</label> <br>
            <input type="checkbox" id="thursday" name="available_field[]" value="Thursday">
            <label for="thursday">Thursday</label> <br>
            <input type="checkbox" id="friday" name="available_field[]" value="Friday">
            <label for="friday">Friday</label> <br>
            <input type="checkbox" id="saturday" name="available_field[]" value="Saturday">
            <label for="saturday">Saturday</label> <br>                                             
        </div>

        <div>
            <label for="comments">Comments</label>
            <br>
            <textarea id="comments" name="comments_field" rows="4" cols="50"></textarea>
        </div>
        
        <div>
            <input type="reset" value="Reset">
        </div>

        <br>
        <div>
            <input type="submit" value="Submit">
        </div>

        <input type="hidden" name="hidden_field" value="Bryan Rebolledo">
                 
    </form>
</body>
</html>
